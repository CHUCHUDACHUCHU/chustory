title: "CHU의 블로그 자동화 실험실"
description: "GPT와 자동화로 돌아가는 실험형 블로그 🤖"
baseurl: ""
url: "https://chuchudachuchu.github.io/chustory/"

# 글 포맷 관련
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 페이지 설정
paginate: 5
paginate_path: "/page:num"

# 기본 메타데이터
author:
  name: "CHU"
  email: "yoon7548@gmail.com" # 필요하면 수정!

# 빌드 제외할 파일/폴더
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Jekyll Remote Theme 설정
# 원격 테마를 사용하기 위한 설정
remote_theme: pages-themes/slate@v0.2.0
plugins:
  - jekyll-remote-theme